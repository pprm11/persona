<!doctype html><meta charset=utf-8><body style="background:#111;color:#ddd"><div id=o></div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
mermaid.initialize({ startOnLoad: false, theme: "dark", securityLevel: "strict" });
var TIGHT = '%%{init: {"flowchart": {"nodeSpacing": 22, "rankSpacing": 30, "padding": 6, "diagramPadding": 4}}}%%\n';
async function measure(variant, only) {
  const ds = await (await fetch("diagrams.json")).json();
  const res = [];
  for (const d of ds) {
    if (only && !only.includes(d.f + d.i)) continue;
    let src = variant.src && variant.src[d.f + d.i] ? variant.src[d.f + d.i] : d.src;
    const isFlow = /^\s*(flowchart|graph)/.test(src);
    if (variant.tight && isFlow) src = TIGHT + src;
    if (variant.tb && isFlow) src = src.replace(/^(\s*(?:flowchart|graph)\s+)LR/m, "$1TB");
    try {
      const out = await mermaid.render("m" + Math.random().toString(36).slice(2), src);
      const vb = out.svg.match(/viewBox="([^"]+)"/)[1].split(" ").map(Number);
      res.push([d.f + d.i, Math.round(vb[2]), Math.round(vb[3])]);
    } catch (e) { res.push([d.f + d.i, "ERR", String(e).slice(0, 80)]); }
  }
  return res;
}
</script><script src="search.js"></script>
